<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with Glowing Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Ambient Glow Line -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.35" />

  <!-- Sparkling Cosmic Star Accent at Top Right -->
  <path d="M49 9 L50.2 13.5 L55 14.5 L50.2 15.5 L49 20 L47.8 15.5 L43 14.5 L47.8 13.5 Z" fill="#ffffff" opacity="0.95" />
  <circle cx="49" cy="14.5" r="1.5" fill="#38bdf8" />

  <!-- Bold Monogram BB -->
  <text x="32" y="42" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="900" 
        letter-spacing="-0.8" 
        fill="url(#textGrad)" 
        text-anchor="middle">BB</text>
</svg>
